<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>

    <!-- Dynamic Flow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }

    /* Ambient dynamic animations in the background layer */
    @keyframes floatA {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    @keyframes floatB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.15); }
    }
    @keyframes dashLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    .anim-float-a { animation: floatA 8s ease-in-out infinite; }
    .anim-float-b { animation: floatB 6s ease-in-out infinite; }
    .anim-orb-1 { animation: pulseOrb 7s ease-in-out infinite; transform-origin: 1050px 90px; }
    .anim-orb-2 { animation: pulseOrb 9s ease-in-out infinite alternate; transform-origin: 150px 300px; }
    .anim-pulse-line {
      stroke-dasharray: 8 6;
      animation: dashLine 20s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Background Animated Glowing Orbs -->
  <circle class="anim-orb-1" cx="1050" cy="90" r="140" fill="#38bdf8" filter="url(#glow)"/>
  <circle class="anim-orb-2" cx="150" cy="300" r="160" fill="#6366f1" filter="url(#glow)"/>

  <!-- Background Decorative Accounting / Chart Lines & Waves -->
  <g opacity="0.3">
    <path class="anim-pulse-line" d="M-50,280 C200,220 350,330 600,260 C850,190 1000,270 1250,210" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path class="anim-pulse-line" d="M-50,310 C250,250 450,350 750,270 C950,220 1100,290 1250,240" fill="none" stroke="#34d399" stroke-width="2"/>
  </g>

  <!-- Animated Background Stat Cards / Pills (Lower Right - Out of Title Way) -->
  <g class="anim-float-a" transform="translate(860, 60)">
    <rect width="270" height="74" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
    <circle cx="36" cy="37" r="18" fill="#0284c7" fill-opacity="0.2"/>
    <text x="36" y="43" text-anchor="middle" font-size="20">☁️</text>
    <text x="68" y="32" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Cloud Financials</text>
    <text x="68" y="52" font-family="sans-serif" font-size="12" fill="#94a3b8">Real-time Ledgers &amp; Bank Feeds</text>
  </g>

  <g class="anim-float-b" transform="translate(890, 160)">
    <rect width="250" height="70" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
    <circle cx="34" cy="35" r="18" fill="#10b981" fill-opacity="0.2"/>
    <text x="34" y="41" text-anchor="middle" font-size="20">⚖️</text>
    <text x="66" y="30" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Double-Entry Rules</text>
    <text x="66" y="50" font-family="sans-serif" font-size="12" fill="#34d399">Debit = Credit Validated</text>
  </g>

  <g class="anim-float-a" transform="translate(840, 255)">
    <rect width="290" height="66" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
    <circle cx="34" cy="33" r="18" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="34" y="39" text-anchor="middle" font-size="20">🔓</text>
    <text x="66" y="28" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Open Source &amp; SaaS</text>
    <text x="66" y="48" font-family="sans-serif" font-size="12" fill="#a78bfa">Enterprise &amp; Self-Hosted Suites</text>
  </g>

  <!-- FOREGROUND: Top Category Tag -->
  <g transform="translate(90, 64)">
    <rect width="260" height="32" rx="16" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="5" fill="#38bdf8"/>
    <text x="30" y="21" class="badge-text">CURATED FINANCIAL STACK 2026</text>
  </g>

  <!-- FOREGROUND: Main Title & Subtitle (Crisp, Permanent, Foreground) -->
  <text x="90" y="152" class="title-text">
    Awesome Cloud Accounting 💰 ☁️
  </text>

  <!-- Gradient Accent Underline Bar -->
  <rect x="90" y="172" width="460" height="4" rx="2" fill="url(#primary-glow)"/>

  <text x="90" y="222" class="subtitle-text">
    The Curated Directory of Commercial Cloud Platforms &amp;
  </text>
  <text x="90" y="254" class="subtitle-text">
    Self-Hosted Open-Source Bookkeeping Frameworks
  </text>

  <!-- Feature Highlights / Pills in Foreground -->
  <g transform="translate(90, 290)">
    <rect width="130" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="65" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">📊 Bookkeeping</text>

    <rect x="145" width="115" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="202" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🧾 Invoicing</text>

    <rect x="275" width="150" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="350" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🏦 Bank Feeds</text>

    <rect x="440" width="145" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="512" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚖️ Double Entry</text>

    <rect x="600" width="140" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="670" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🔐 Self-Hosted</text>
  </g>
</svg>
